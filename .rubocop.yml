plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "bin/**/*"
    - "*.gemspec"

# This library's job is to explain a set of unusual decisions, so the comment
# density is high on purpose and the classes are long because splitting them
# would scatter one argument across five files.
Layout/LineLength:
  Max: 110

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

# exec_insert's signature belongs to ActiveRecord, optional positionals and all.
Metrics/ParameterLists:
  Max: 8
  MaxOptionalParameters: 5
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "lib/discord_store/tasks.rake"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: true

Minitest/MultipleAssertions:
  Max: 8

# These files implement interfaces defined elsewhere: the ActiveRecord and
# ActiveStorage contracts, and the internal cipher contract whose null
# implementation accepts an aad it has no use for. The argument names are not
# ours to change.
Lint/UnusedMethodArgument:
  Exclude:
    - "lib/active_record/connection_adapters/discord_adapter.rb"
    - "lib/active_storage/service/discord_service.rb"
    - "lib/discord_store/cipher.rb"

# ActiveRecord calls exec_insert with a positional `pk`.
Naming/MethodParameterName:
  AllowedNames: ["pk", "io", "id", "to", "at", "by", "on"]
