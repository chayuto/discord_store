name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        gemfile: [rails_7.2, rails_8.0, rails_8.1]
        exclude:
          # Rails 8 requires Ruby >= 3.2.
          - { ruby: "3.1", gemfile: rails_8.0 }
          - { ruby: "3.1", gemfile: rails_8.1 }
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # No network access is needed: the suite, including Rails' ActiveStorage
      # conformance tests, runs against an in-memory Discord.
      - run: bundle exec rake test

  gemfiles:
    name: Appraisal gemfiles current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The test matrix runs with BUNDLE_GEMFILE=gemfiles/*.gemfile. Those files
      # are generated from the root Gemfile and committed, so a change to the
      # root Gemfile that is not regenerated gets tested against the *old* pins
      # and reports a green that means nothing. A Dependabot bundler bump does
      # exactly that: it edits Gemfile and cannot know gemfiles/ exists.
      #
      # Regenerate and fail if anything moved.
      - run: bundle exec appraisal generate
      - name: Check gemfiles/ is in sync with Gemfile
        run: |
          if ! git diff --quiet -- gemfiles/; then
            echo "::error::gemfiles/ is stale. Run 'bundle exec appraisal generate' and commit the result."
            git diff -- gemfiles/
            exit 1
          fi
          echo "gemfiles/ matches the root Gemfile"

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: gem build discord_store.gemspec

      # A gemspec files glob is easy to get subtly wrong, and the failure only
      # shows up for people who install the gem rather than clone it. Install
      # the built artefact into an empty GEM_HOME with no bundler around, then
      # require it and use it.
      - name: Install the built gem in isolation and use it
        run: |
          export GEM_HOME="$RUNNER_TEMP/isolated"
          export GEM_PATH="$GEM_HOME"
          gem install ./discord_store-*.gem --no-document
          cd "$RUNNER_TEMP"
          ruby -e '
            require "discord_store"
            fake = DiscordStore::Transport::Fake.new(application_id: "1")
            client = DiscordStore::Client.new(
              config: DiscordStore::Configuration.new.tap { |c|
                c.i_understand_this_violates_discord_tos = true
                c.token = "t"
                c.application_id = "1"
                c.secret_key = DiscordStore.generate_key
                c.log_channel_ids = ["9"]
              },
              http: fake
            )
            client.log.append(stream: "smoke", data: { "hello" => "world" })
            raise "round trip failed" unless client.log.read.first.data == { "hello" => "world" }
            puts "installed gem round-trips: ok"
          '

      - name: Refuse to run without the acknowledgement
        run: |
          export GEM_HOME="$RUNNER_TEMP/isolated"
          export GEM_PATH="$GEM_HOME"
          cd "$RUNNER_TEMP"
          ruby -e '
            require "discord_store"
            begin
              DiscordStore::Configuration.new.tap { |c| c.token = "t" }.validate!
              raise "the Terms of Service guard did not fire"
            rescue DiscordStore::UnacknowledgedError
              puts "ToS guard holds: ok"
            end
          '
