name: Bug report
description: Something behaves differently from what the README claims
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: the suite runs with no bot token and no network
        (`bundle exec rake`). If you can reproduce the problem against
        `DiscordStore::Transport::Fake`, say so — that turns a report into a
        failing test.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest script that shows it. Redact tokens and keys.
      render: ruby
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Against what
      options:
        - Transport::Fake (no network)
        - Real Discord
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: discord_store, Ruby, Rails.
      placeholder: "discord_store 0.1.0, Ruby 3.3.10, Rails 8.1.3.1"
    validations:
      required: true

  - type: textarea
    id: layer
    attributes:
      label: Which layer
      description: Transport, Log, ActiveStorage service, ActiveRecord adapter, or KV.
